name: Generated files

on:
  # Nightly, outside merge hours. A push straight to main resets every merge-queue batch, so the
  # regeneration no longer runs on each push.
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

# One run at a time; a burst of merges leaves one run waiting, which sees all of them.
concurrency:
  group: generated-files
  cancel-in-progress: false

jobs:
  regenerate:
    name: Prepare generated files for review
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # Generate only from the protected branch because this job pushes the update branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: generated-files
      - name: THIRD-PARTY-LICENSES.txt
        run: cargo xtask licences
      - name: docs/features.md
        run: cargo xtask features
      - name: Pending locale strings and attribution rows
        run: cargo xtask fold-pending
      - name: Push a review branch
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_BRANCH: automation/generated-files
        run: |
          set -euo pipefail
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head "$REVIEW_BRANCH" \
            --state open --json url --jq '.[0].url // empty')
          if [[ -n "$open" ]]; then
            printf 'An update is already open for review: %s\n' "$open" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Generated files are current." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A THIRD-PARTY-LICENSES.txt docs/features.md assets/locales ATTRIBUTION.md attribution
          git commit -m "Regenerate generated files and fold pending files"
          remote=$(git ls-remote --heads origin "refs/heads/$REVIEW_BRANCH" | cut -f1)
          git push --force-with-lease="refs/heads/$REVIEW_BRANCH:$remote" \
            origin "HEAD:refs/heads/$REVIEW_BRANCH"
          printf '[Open a pull request](%s/%s/compare/main...%s?expand=1) to run CI and request review.\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$REVIEW_BRANCH" >> "$GITHUB_STEP_SUMMARY"
